# tmux profile used only by claude-tabs / claude-hub (does not touch ~/.tmux.conf).
set -g default-terminal "tmux-256color"
if-shell 'test "$(uname)" = Darwin' 'set -g default-terminal "screen-256color"'   # macOS terminfo lacks tmux-256color
set -g mouse on                  # click a project or tab to switch, click "+ new" to add one
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g detach-on-destroy off   # closing a project's last tab moves the hub to another project
set -g allow-rename off          # tab labels come from Claude's own terminal title (#{pane_title})

# Bar: two rows. Top row = projects (one tmux session each), bottom row = tabs of the
# selected project. Each project is a clickable range named by its session id ($N). Both rows
# are tmux lists: when they overflow, < and > mark the hidden part, the row scrolls to keep the
# current item visible, and the mouse wheel over a row steps through it.
# A browser terminal (claude-desk-term) joins a project as the grouped session "web<name>", which
# is why the current project is matched by suffix.
set -g status-position bottom
set -g status-style "bg=colour236,fg=colour250"
set -g status 2
# The top row is written by "claude-hub bar": the projects in the order of ~/.local/state/claude-tabs/order.
set-hook -g session-created "run-shell '~/.local/bin/claude-hub bar'"
set-hook -g session-closed  "run-shell '~/.local/bin/claude-hub bar'"
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-left "#[bold]  Tabs  #[nobold]│ "
set -g status-left-length 14
set -g status-right "#[bg=colour31,fg=white,bold]  + new  #[default]"
set -g status-right-length 10
set -g window-status-separator " "
set -g window-status-style "bg=colour239,fg=colour255,bold"
set -g window-status-format " #I #{=24:pane_title} "
set -g window-status-current-format "#[bg=colour31,fg=white,bold] #I #{=24:pane_title} #[default]"

# Mouse: left-click a project (top row) or a tab (bottom row); drag either to move it; "+" at the
# right end of the top row adds a project; right-click a tab to close it, a project to remove it.
# Closing goes through claude-tabs --close so the tab does not come back after a reboot.
bind -n MouseDown1Status if -F '#{m:$*,#{mouse_status_range}}' { run-shell 'tmux -S #{q:socket_path} switch-client -c #{q:client_name} -t #{q:mouse_status_range}' } { if -F '#{==:#{mouse_status_range},addproject}' { display-popup -E -w 80 -h 6 "~/.local/bin/claude-hub add" } { select-window -t = } }
bind -n MouseDown1StatusRight new-window -c "#{session_path}" "~/.local/bin/claude-tab new"
# swap-window does not expand formats in -t, and "=" stays on the clicked tab during a drag.
bind -n MouseDrag1Status if -F '#{==:#{mouse_status_range},window}' { run-shell 'tmux -S #{q:socket_path} swap-window -d -s =#{q:session_name}:#{active_window_index} -t =#{q:session_name}:#{window_index}' } { if -F '#{m:$*,#{mouse_status_range}}' { run-shell '~/.local/bin/claude-hub move #{q:client_session} #{q:mouse_status_range}' } }
bind -n MouseDragEnd1Status run-shell 'cd #{q:session_path} && ~/.local/bin/claude-tabs --sync'
# Wheel over the top row steps through projects, over the bottom row through tabs.
bind -n WheelUpStatus   if -F '#{==:#{mouse_status_line},0}' 'switch-client -p' 'previous-window'
bind -n WheelDownStatus if -F '#{==:#{mouse_status_line},0}' 'switch-client -n' 'next-window'
bind -n MouseDown3Status if -F '#{==:#{mouse_status_range},window}' { select-window -t = ; confirm-before -p "Close this Claude tab? (y/n)" "run-shell 'cd #{q:session_path} && ~/.local/bin/claude-tabs --close #{window_id}'" } { if -F '#{m:$*,#{mouse_status_range}}' { run-shell '~/.local/bin/claude-hub ask-remove #{q:mouse_status_range} #{q:client_name}' } }

# Keys that work without the Ctrl+B prefix
bind -n M-n     new-window -c "#{session_path}" "~/.local/bin/claude-tab new"
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-Up    switch-client -p       # previous project
bind -n M-Down  switch-client -n       # next project
bind -n M-S-Left  { swap-window -d -t -1 ; run-shell 'cd #{q:session_path} && ~/.local/bin/claude-tabs --sync' }   # move tab left
bind -n M-S-Right { swap-window -d -t +1 ; run-shell 'cd #{q:session_path} && ~/.local/bin/claude-tabs --sync' }   # move tab right
bind -n M-S-Up    run-shell '~/.local/bin/claude-hub move #{q:session_name} -1'   # move project left in the top row
bind -n M-S-Down  run-shell '~/.local/bin/claude-hub move #{q:session_name} +1'   # move project right

# Prefix (Ctrl+B) keys
bind c new-window -c "#{session_path}" "~/.local/bin/claude-tab new"
bind x confirm-before -p "Close this Claude tab? (y/n)" "run-shell 'cd #{q:session_path} && ~/.local/bin/claude-tabs --close #{window_id}'"

# kitty tab / window title: "Claude: <project>"
set -g set-titles on
set -g set-titles-string "Claude: #{b:session_path}"
